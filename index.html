  <div id="stage"></div>
  <section id="info" aria-live="polite">
    <h1 id="title"></h1>
    <p id="hook"></p>
    <p id="desc"></p>
    <div id="saved"></div>
    <p id="row-a11y" class="sr"></p>
  </section>
  <nav id="dock" aria-label="Menu">
    <button type="button" data-act="play">▶ JOGAR</button>
    <button type="button" data-act="videos">VÍDEOS</button>
    <button type="button" data-act="channel">CANAL</button>
    <button type="button" data-act="options">OPÇÕES</button>
  </nav>
  <div class="spacer"></div>
  <footer id="hints"></footer>
</div>
<div id="panel" hidden role="dialog" aria-modal="true">
  <div class="box"><h2><span></span><button type="button" class="close" aria-label="Fechar">✕</button></h2><ul></ul></div>
</div>
<div id="fade"></div>
