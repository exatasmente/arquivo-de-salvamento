<!doctype html><meta charset="utf-8"><title>sfx offline render</title>
<script type="module">
import { createSfx, SFX_NAMES } from '../src/audio/sfx.js';
// Renders one sound offline and returns { sr, ch: [Float32 as base64] }.
window.renderSfx = async (name, opts, length, sr = 22050, seed = 7) => {
  const ctx = new OfflineAudioContext(2, Math.ceil(length * sr), sr);
  const sfx = createSfx(ctx, { seed });
  sfx.play(name, { at: 0.05, ...opts });
  const buf = await ctx.startRendering();
  const enc = (a) => { let s = ''; const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
  return { sr, ch: [enc(buf.getChannelData(0)), enc(buf.getChannelData(1))] };
};
window.SFX_NAMES = SFX_NAMES; window.ready = true;
</script>
