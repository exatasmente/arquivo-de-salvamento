<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>O Dia que Sobra · prévia dos controles do celular</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../mobile.css">
<style>
  #c { width: 100%; height: 100%; }
  #log { position: absolute; left: 8px; top: 8px; z-index: 20; max-width: 60vw; font: 11px/1.3 "Courier New", monospace; color: #9fe0a8; background: rgba(0,0,0,.6); padding: 4px 6px; pointer-events: none; white-space: pre; }
  #bar { position: absolute; right: 8px; top: 8px; z-index: 20; display: flex; flex-direction: column; gap: 4px; }
  #bar button { font: bold 11px "Courier New", monospace; padding: 6px 8px; background: #1b1e29; color: #e8dfc4; border: 1px solid #c9a24a; }
</style>
</head>
<body class="touch">
<!-- A page to try the phone's layer alone (src/touch/mobile.js): a picture that turns with the look, the stick
     moving a dot, the actions and the hiding place switched from the buttons on the right. ?state=pump|hide|walk -->
<div id="app"><canvas id="c"></canvas></div>
<div id="log"></div>
<div id="bar"><button data-s="walk">ANDANDO</button><button data-s="pump">BOMBA</button><button data-s="hide">ESCONDIDO</button><button id="gyro">GIROSCÓPIO</button><button id="left">CANHOTO</button></div>
<script type="module" src="./mobile-preview.js"></script>
</body>
</html>
