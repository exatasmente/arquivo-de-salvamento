<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cutscenes - prévia</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden;font:12px "Courier New",monospace;color:#e8dfc4}
#app{position:fixed;inset:0}#c{position:absolute;left:0;top:0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,10,16,.85);padding:6px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bar select,#bar button,#bar input[type=range]{font:inherit}#t{flex:1;min-width:160px}
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head><body>
<div id="app"><canvas id="c"></canvas></div>
<div id="bar"><select id="cs"></select><select id="view"></select><button id="play">TOCAR (ao vivo)</button><button id="stop">PARAR</button>
<label><input type="checkbox" id="rf"> reduzir clarões</label><input id="t" type="range" min="0" max="1" step="0.01" value="0"><span id="info"></span></div>
<script type="module" src="./cutscene-preview.js"></script>
</body></html>
